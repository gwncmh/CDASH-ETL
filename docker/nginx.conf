server {
    listen 80;

    root /usr/share/nginx/html;
    index cdash_dashboard.html;

    # Dashboard
    location / {
        try_files $uri /cdash_dashboard.html;
    }

    # GeoJSON exports cho Kepler.gl — no-cache vì cập nhật sau mỗi pipeline run
    location /exports/ {
        alias /exports/;                               # ← trỏ vào /exports
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy tới exporter (Airflow trigger, hoặc test thủ công)
    location /api/ {
        proxy_pass         http://exporter:5000/;
        proxy_set_header   Host $host;
    }
}